services:
  - type: web
    name: ia-desahogo-agente
    runtime: node
    rootDir: agente
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    envVars:
      - {key: ALLOW_ORIGIN, sync: false}
      - {key: SMTP_HOST, sync: false}
      - {key: SMTP_PORT, value: "587"}
      - {key: SMTP_USER, sync: false}
      - {key: SMTP_PASS, sync: false}
      - {key: MAIL_FROM, sync: false}
      - {key: PUBLIC_URL, sync: false}
  - type: web
    name: ia-desahogo-proxy
    runtime: node
    rootDir: proxy
    startCommand: node server.js
    plan: free
    envVars:
      - {key: GEMINI_API_KEY, sync: false}
      - {key: ALLOW_ORIGIN, sync: false}
      - {key: MAX_PER_HOUR, value: "60"}
